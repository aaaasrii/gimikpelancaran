<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gimik Pelancaran Tapak Tangan</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      background-color: #010611;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    /* Canvas Partikel Latar Belakang */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Latar Belakang Grid & Scanlines */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        repeating-linear-gradient(0deg, rgba(0,0,0,0.75) 0px, rgba(0,0,0,0.75) 2px, transparent 2px, transparent 4px),
        linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      z-index: 2;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      height: 100vh;
      padding: 20px;
      color: #00f0ff;
      text-align: center;
    }

    /* Tajuk Utama */
    .header-zone h1 {
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      letter-spacing: 5px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px rgba(0, 240, 255, 0.6);
    }

    .header-zone p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      color: #a0c0d0;
      letter-spacing: 3px;
      margin-top: 10px;
    }

    /* Bekas Pad Imbasan (Saiz Besar) */
    .palm-container {
      position: relative;
      width: clamp(350px, 65vw, 560px);
      height: clamp(420px, 65vh, 650px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(0, 240, 255, 0.02);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 28px;
      box-shadow: inset 0 0 45px rgba(0, 240, 255, 0.1), 0 0 40px rgba(0, 0, 0, 0.9);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Bingkai Sudut Cyberpunk */
    .palm-container::before, .palm-container::after {
      content: '';
      position: absolute;
      width: 40px; height: 40px;
      border: 4px solid #00f0ff;
      pointer-events: none;
    }
    .palm-container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 24px 0 0 0; }
    .palm-container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 24px 0; }

    /* Gambar Tapak Tangan */
    .palm-img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      opacity: 0.75;
      filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.5));
      mix-blend-mode: screen;
      transition: all 0.3s ease;
    }

    /* Laser Line */
    .laser-line {
      position: absolute;
      left: 5%;
      width: 90%;
      height: 5px;
      background: #00f0ff;
      box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 50px #00f0ff;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Kaunter Peratusan */
    .percent-counter {
      position: absolute;
      font-size: 3.2rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 20px #00f0ff, 0 0 35px #00f0ff;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 11;
    }

    /* Status Badge Dynamic */
    .status-badge {
      padding: 12px 36px;
      background: rgba(0, 240, 255, 0.05);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 30px;
      font-size: clamp(1.1rem, 2.2vw, 1.4rem);
      letter-spacing: 2px;
      font-weight: 700;
      color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      transition: all 0.3s ease;
    }

    /* KESAN DITEKAN (.holding) */
    .palm-container.holding {
      background: rgba(0, 240, 255, 0.12);
      border-color: #00f0ff;
      box-shadow: inset 0 0 70px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.6);
      transform: scale(0.98);
    }

    .palm-container.holding .palm-img {
      opacity: 1;
      transform: scale(1.04);
      filter: drop-shadow(0 0 50px #00f0ff) brightness(1.3);
    }

    .palm-container.holding .laser-line {
      opacity: 1;
      animation: scanAnimation 1.5s linear infinite;
    }

    .palm-container.holding .percent-counter {
      opacity: 1;
    }

    @keyframes scanAnimation {
      0% { top: 5%; }
      50% { top: 90%; }
      100% { top: 5%; }
    }

    /* Shockwave Effect */
    .shockwave {
      position: fixed;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: radial-gradient(circle, #ffffff 10%, #00ff88 50%, transparent 80%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 99;
      pointer-events: none;
    }

    .shockwave.active {
      animation: shockwaveEffect 0.8s ease-out forwards;
    }

    @keyframes shockwaveEffect {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(300); opacity: 0; }
    }

    /* OVERLAY BANNER SAKSI KEJAYAAN (SUCCESSFUL OVERLAY) */
    #success-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(1, 6, 17, 0.92);
      backdrop-filter: blur(10px);
      z-index: 90;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .success-box {
      border: 3px solid #00ff88;
      border-radius: 24px;
      padding: 40px 60px;
      background: rgba(0, 255, 136, 0.08);
      box-shadow: 0 0 50px rgba(0, 255, 136, 0.4), inset 0 0 30px rgba(0, 255, 136, 0.2);
      animation: popSuccess 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-icon {
      font-size: 5rem;
      color: #00ff88;
      text-shadow: 0 0 30px #00ff88;
      margin-bottom: 15px;
    }

    .success-box h2 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      color: #00ff88;
      letter-spacing: 6px;
      font-weight: 900;
      text-shadow: 0 0 25px #00ff88;
      margin-bottom: 10px;
    }

    .success-box p {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      color: #ffffff;
      letter-spacing: 4px;
      font-weight: 700;
    }

    @keyframes popSuccess {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Container Video */
    #video-container {
      display: none;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      background: #000;
      z-index: 100;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    /* Butang Reset */
    .reset-btn {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 110;
      padding: 12px 26px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00f0ff;
      background: rgba(1, 6, 17, 0.85);
      border: 2px solid #00f0ff;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(8px);
    }

    .reset-btn:active {
      background: #00f0ff;
      color: #010611;
    }
  </style>
</head>
<body>

  <!-- Element Audio Fizikal -->
  <audio id="scanAudio" src="sound.mp3" preload="auto" loop></audio>

  <!-- Canvas Partikel Latar Belakang -->
  <canvas id="particleCanvas"></canvas>

  <!-- Letupan Shockwave -->
  <div class="shockwave" id="shockwave"></div>

  <!-- UI Imbasan Utama -->
  <div id="ui" class="wrapper">
    <div class="header-zone">
      <h1>MAJLIS PELANCARAN</h1>
      <p>SILA LETAKKAN TAPAK TANGAN UNTUK IMBASAN BIOMETRIK</p>
    </div>

    <div class="palm-container" id="palmScanner">
      <div class="laser-line"></div>
      <div class="percent-counter" id="percentCounter">0%</div>
      <img src="palm_print.jpg" class="palm-img" alt="Palm Scanner">
    </div>

    <div class="status-badge" id="statusText">SYSTEM READY</div>
  </div>

  <!-- OVERLAY SKRIN SUCCESSFUL -->
  <div id="success-overlay">
    <div class="success-box">
      <div class="success-icon">✓</div>
      <h2>SUCCESSFUL!</h2>
      <p>LAUNCH AUTHORIZED</p>
    </div>
  </div>

  <!-- Container Video Pelancaran -->
  <div id="video-container">
    <button class="reset-btn" onclick="resetGimmick()">↺ RESET / KEMBALI</button>
    <video id="launchVideo" src="video_pelancaran.mp4" playsinline></video>
  </div>

  <script>
    const scanner = document.getElementById('palmScanner');
    const statusText = document.getElementById('statusText');
    const percentCounter = document.getElementById('percentCounter');
    const shockwave = document.getElementById('shockwave');
    const successOverlay = document.getElementById('success-overlay');
    const container = document.getElementById('video-container');
    const video = document.getElementById('launchVideo');
    const scanAudio = document.getElementById('scanAudio');
    
    let timer, progressInterval;
    let progress = 0;
    let isHolding = false;
    const holdTime = 3500; // Masa Imbasan: 3.5 Saat

    /* ======================================================
       AUDIO UNLOCKER
       ====================================================== */
    function unlockAudio() {
      scanAudio.play().then(() => {
        scanAudio.pause();
        scanAudio.currentTime = 0;
      }).catch(err => console.log("Audio unlock restriction:", err));
    }

    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function startScanSound() {
      scanAudio.currentTime = 0;
      scanAudio.play().catch(e => console.log("Audio play error:", e));
    }

    function stopScanSound() {
      scanAudio.pause();
      scanAudio.currentTime = 0;
    }

    /* ======================================================
       LOGIK IMBASAN & STATUS ANALYZING
       ====================================================== */
    function startProcess(e) {
      if (e) e.preventDefault();
      if (isHolding) return;
      
      isHolding = true;
      scanner.classList.add('holding');
      startScanSound();

      progress = 0;
      percentCounter.innerText = "0%";
      statusText.innerText = "INITIALIZING BIOMETRIC SCAN...";
      statusText.style.color = "#00f0ff";
      statusText.style.borderColor = "#00f0ff";

      progressInterval = setInterval(() => {
        progress += 1;
        if (progress > 100) progress = 100;
        percentCounter.innerText = progress + "%";

        // PERINGKAT-PERINGKAT ANALYZING SCI-FI
        if (progress === 15) {
          statusText.innerText = "SCANNING PALM RIDGES...";
        } else if (progress === 35) {
          statusText.innerText = "ANALYZING BIOMETRIC DATA...";
        } else if (progress === 55) {
          statusText.innerText = "CROSS-CHECKING SYSTEM DATABASE...";
        } else if (progress === 75) {
          statusText.innerText = "VERIFYING AUTHORIZATION KEY...";
        } else if (progress === 90) {
          statusText.innerText = "ENCRYPTING LAUNCH CODE...";
        } else if (progress === 98) {
          statusText.innerText = "AUTHENTICATION COMPLETE!";
        }
      }, 35);

      timer = setTimeout(mulaPelancaran, holdTime);
    }

    function cancelProcess() {
      if (!isHolding) return;
      
      isHolding = false;
      scanner.classList.remove('holding');
      stopScanSound();
      clearInterval(progressInterval);
      
      statusText.innerText = "SYSTEM READY";
      statusText.style.color = "#00f0ff";
      statusText.style.borderColor = "rgba(0, 240, 255, 0.4)";
      percentCounter.innerText = "0%";
      clearTimeout(timer);
    }

    /* ======================================================
       LOGIK KEJAYAAN (SUCCESSFUL STATE)
       ====================================================== */
    function mulaPelancaran() {
      isHolding = false;
      stopScanSound();
      clearInterval(progressInterval);

      // 1. Tukar Status Pada Frame
      statusText.innerText = "SUCCESSFUL!";
      statusText.style.color = "#00ff88";
      statusText.style.borderColor = "#00ff88";

      // 2. Aktifkan Shockwave
      shockwave.classList.add('active');

      // 3. Tunjukkan Skrin Overlay SUCCESSFUL Khas
      setTimeout(() => {
        successOverlay.style.display = 'flex';
      }, 300);

      // 4. Mainkan Video Pelancaran Selepas 1.5 Saat (Memberi masa penonton melihat status SUCCESSFUL)
      setTimeout(() => {
        successOverlay.style.display = 'none';
        document.getElementById('ui').style.display = 'none';
        container.style.display = 'block';
        video.play();
        shockwave.classList.remove('active');
      }, 1800);
    }

    function resetGimmick() {
      video.pause();
      video.currentTime = 0;
      container.style.display = 'none';
      successOverlay.style.display = 'none';
      document.getElementById('ui').style.display = 'flex';
      cancelProcess();
    }

    // Event Listener
    scanner.addEventListener('mousedown', startProcess);
    scanner.addEventListener('touchstart', startProcess, { passive: false });

    window.addEventListener('mouseup', cancelProcess);
    window.addEventListener('touchend', cancelProcess);

    /* ======================================================
       PARTIKEL LATAR BELAKANG
       ====================================================== */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        speedY: Math.random() * -0.8 - 0.2,
        opacity: Math.random() * 0.5 + 0.2
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        if (p.y < 0) p.y = canvas.height;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 240, 255, ${p.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f0ff';
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>

</body>
</html>
